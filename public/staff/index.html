<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafra Lodge - Staff Timeclock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Cause', sans-serif; }
        body { margin: 0; background-color: #f4f6f9; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        #login-screen { display: flex; height: 100vh; width: 100vw; background-image: url('background.png'); background-size: cover; background-position: center; position: absolute; top: 0; left: 0; align-items: center; justify-content: flex-start; padding-left: 8%; z-index: 1000; }
        #login-screen::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1; }
        .login-box { position: relative; z-index: 2; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 45px 40px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; max-width: 400px; }
        .login-box h2 { font-size: 32px; color: #333; margin-top: 0; margin-bottom: 10px; }
        .login-box p { color: #6c757d; margin-bottom: 30px; font-size: 15px; }
        .login-box label { font-weight: bold; font-size: 14px; color: #495057; display: block; margin-bottom: 8px; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 25px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; transition: 0.2s; }
        .login-box button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        #app-screen { display: none; height: 100vh; width: 100vw; flex-direction: row; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; }
        .sidebar { width: 240px; background: #343a40; color: white; padding: 20px; display: flex; flex-direction: column; transition: 0.3s ease; z-index: 1000; }
        .sidebar h2 { margin-top: 0; color: #fff; border-bottom: 1px solid #4f5962; padding-bottom: 20px; font-size: 22px; text-align: center; }
        .staff-info { padding: 20px 15px; background: #2b3035; border-radius: 8px; margin-bottom: 20px; text-align: center; color: #adb5bd; font-size: 16px; }
        .nav-item { padding: 15px; margin: 5px 0; background: #007bff; border-radius: 5px; font-weight: bold; color: white; font-size: 15px; display: flex; align-items: center; gap: 12px; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; margin-top: auto; font-weight: bold; text-align: center; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; }
        .content-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .mobile-header { display: none; background: #fff; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); align-items: center; justify-content: space-between; z-index: 10; width: 100%; }
        .hamburger-btn { background: none; border: none; font-size: 24px; color: #333; cursor: pointer; }
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; background: #f4f6f9; overflow-y: auto; padding: 20px; }
        .timeclock-widget { background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 500px; border: 1px solid #eee; }
        .date-display { color: #6c757d; font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .time-display { font-size: 64px; font-weight: bold; color: #343a40; margin: 0 0 30px 0; letter-spacing: -2px; }
        .status-badge { display: inline-block; padding: 8px 20px; border-radius: 30px; font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 40px; }
        .status-badge.out { background: #ffeeba; color: #004085; }
        .status-badge.in { background: #d4edda; color: #155724; }
        .punch-btn { width: 100%; padding: 25px; border-radius: 12px; border: none; font-size: 24px; font-weight: bold; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .punch-btn.btn-in { background: #28a745; }
        .punch-btn.btn-out { background: #dc3545; }
        @media (max-width: 768px) { #app-screen { flex-direction: column; } .mobile-header { display: flex; } .sidebar { position: fixed; left: -260px; height: 100vh; width: 260px; } .sidebar.open { left: 0; } .sidebar-overlay.open { display: block; } #login-screen { padding-left: 0; justify-content: center; } .time-display { font-size: 46px; } }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>Staff Timeclock</h2>
            <p>Log in to record your shift attendance.</p>
            <label>Username</label>
            <input type="text" id="username" placeholder="e.g. faith">
            <label>Password / PIN</label>
            <input type="password" id="pin" placeholder="••••">
            <button onclick="attemptLogin()">Secure Log In</button>
        </div>
    </div>
    <div id="app-screen">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar" id="sidebar">
            <h2>Mafra Lodge</h2>
            <div class="staff-info">
                <i class="fa-solid fa-circle-user" style="font-size: 32px; display: block; margin-bottom: 10px; color: #fff;"></i>
                <div id="staff-name-display" style="color: #fff; font-weight: bold; font-size: 18px;">---</div>
                <div style="font-size: 12px; margin-top: 5px; text-transform: uppercase;">Waitstaff</div>
            </div>
            <div class="nav-item"><i class="fa-solid fa-business-time"></i> Shift Check-In</div>
            <div style="flex-grow: 1;"></div>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
        </div>
        <div class="content-wrapper">
            <div class="mobile-header">
                <h2 style="margin: 0; font-size: 20px;">Timeclock</h2>
                <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            </div>
            <div class="main-content">
                <div class="timeclock-widget">
                    <div class="date-display" id="live-date">---</div>
                    <h1 class="time-display" id="live-time">00:00:00</h1>
                    <div id="status-indicator" class="status-badge out">Checking Status...</div>
                    <button id="clock-action-btn" class="punch-btn btn-in" onclick="toggleClock()" disabled>
                        <i class="fa-solid fa-spinner fa-spin"></i> PLEASE WAIT
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const API_URL = "http://213.199.41.83:5000";
        let currentUsername = localStorage.getItem('staff_username') || '';
        let isClockedIn = false;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.addEventListener("DOMContentLoaded", () => {
            if(localStorage.getItem('staff_logged_in') === 'true') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex'; 
                document.getElementById('staff-name-display').innerText = currentUsername;
                syncStatusWithServer();
            }
        });

        // 👉 NEW: This asks the DATABASE for the real status
        async function syncStatusWithServer() {
            try {
                const response = await fetch(`${API_URL}/api/attendance`);
                const data = await response.json();
                if (data.success) {
                    // Filter logs for this specific staff member
                    // We need to fetch the staff list to get the ID, or just check username if backend allows
                    const staffResponse = await fetch(`${API_URL}/api/staff`);
                    const staffData = await staffResponse.json();
                    const user = staffData.staff.find(s => s.username === currentUsername);
                    
                    if (user) {
                        const userLogs = data.records.filter(r => r.user_id === String(user._id));
                        // If the latest log has no clock_out, they are IN
                        if (userLogs.length > 0 && !userLogs[0].clock_out) {
                            isClockedIn = true;
                        } else {
                            isClockedIn = false;
                        }
                    }
                    renderClockUI();
                }
            } catch (e) { console.error("Sync error:", e); }
        }

        async function attemptLogin() {
            const username = document.getElementById('username').value;
            const pin = document.getElementById('pin').value;
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, pin, attemptedRole: 'staff' })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('staff_logged_in', 'true');
                    localStorage.setItem('staff_username', username);
                    currentUsername = username;
                    document.getElementById('staff-name-display').innerText = username;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    syncStatusWithServer();
                } else alert(data.message);
            } catch (error) { alert("Could not connect to server."); }
        }

        function renderClockUI() {
            const btn = document.getElementById('clock-action-btn');
            const badge = document.getElementById('status-indicator');
            btn.disabled = false;

            if (isClockedIn) {
                btn.className = 'punch-btn btn-out';
                btn.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> PUNCH OUT';
                badge.className = 'status-badge in';
                badge.innerText = 'Currently: CLOCKED IN';
            } else {
                btn.className = 'punch-btn btn-in';
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> PUNCH IN';
                badge.className = 'status-badge out';
                badge.innerText = 'Currently: CLOCKED OUT';
            }
        }

        async function toggleClock() {
            const action = isClockedIn ? 'out' : 'in';
            const btn = document.getElementById('clock-action-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PROCESSING...';

            try {
                const response = await fetch(`${API_URL}/api/attendance`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, action })
                });
                const data = await response.json();
                if (data.success) {
                    isClockedIn = !isClockedIn;
                    renderClockUI();
                    alert(isClockedIn ? "Punched In Successfully!" : "Punched Out Successfully!");
                } else alert("Error: " + data.message);
            } catch (error) { alert("Server connection failed."); }
            btn.disabled = false;
        }

        function logout() {
            localStorage.clear();
            location.reload(); 
        }
    </script>
</body>
</html>
